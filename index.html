erm{max-width:18ch;font-size:clamp(2.25rem,7vw,4.8rem);font-weight:750;line-height:1;letter-spacing:-.055em;overflow-wrap:anywhere}.definition{max-width:34ch;font-size:clamp(1.2rem,3vw,1.8rem);line-height:1.45}.hint{position:absolute;bottom:23px;font-size:13px;opacity:.58}.nav{margin-top:18px}.center{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1}.primary{background:var(--green);color:#fff;border-color:var(--green)}.keyboard{text-align:center;color:#68817c;font-size:13px}.hidden{display:none}.card:focus-visible,.action:focus-visible,.icon:focus-visible{outline:3px solid #4fa994;outline-offset:4px}@media(max-width:520px){.app{padding:20px 14px}.action{padding:0 12px}.label{display:none}.keyboard{display:none}.face{padding:28px 22px 56px}}@media(prefers-reduced-motion:reduce){.inner{transition:none}}
.aliases{max-width:45ch;font-size:clamp(.85rem,2.4vw,1rem);line-height:1.4;color:var(--green);overflow-wrap:anywhere}.term.long{font-size:clamp(1.6rem,5vw,3rem);line-height:1.08;max-width:24ch}.back .category{max-width:100%;overflow-wrap:anywhere;letter-spacing:.06em}.face{gap:22px}.definition{font-size:clamp(1.05rem,2.6vw,1.55rem)}@media(max-width:520px){.face{gap:18px}.definition{line-height:1.4}}</style><style>.splash{position:fixed;z-index:100;inset:0;display:grid;place-items:center;overflow:hidden;isolation:isolate;background:linear-gradient(145deg,#092c28,#123a35 55%,#0e4a40);color:#fff;animation:splash-away .9s 2.45s cubic-bezier(.7,0,.25,1) forwards}.splash:before{content:"";position:absolute;z-index:-1;width:min(72vw,680px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#65cbb03d 0,#65cbb012 38%,transparent 70%);animation:halo 2.3s ease-in-out both}.splash:after{content:"";position:absolute;inset:-40%;z-index:-1;background:linear-gradient(105deg,transparent 43%,#fff1b21c 49%,#fff5cb38 50%,#fff1b21c 51%,transparent 57%);transform:translateX(-55%) rotate(8deg);animation:light-sweep 1.5s .45s cubic-bezier(.2,.7,.2,1) both}.splash-inner{text-align:center}.splash-mark{display:flex;justify-content:center;gap:.02em;margin:0;color:var(--gold);font-size:clamp(4rem,18vw,9rem);font-weight:850;letter-spacing:-.1em;line-height:.8;text-shadow:0 0 42px #f7e7a52b}.splash-mark span{display:inline-block;opacity:0;filter:blur(12px);transform:translateY(30px) scale(.84);animation:letter-in .8s cubic-bezier(.16,1,.3,1) forwards}.splash-mark span:nth-child(2){animation-delay:.11s}.splash-mark span:nth-child(3){animation-delay:.22s}.splash-rule{width:0;height:1px;margin:1.4rem auto 1rem;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:rule-in .9s .55s cubic-bezier(.16,1,.3,1) forwards}.splash-name{margin:0;font-size:clamp(.9rem,3vw,1.3rem);font-weight:600;letter-spacing:.22em;text-transform:uppercase;opacity:0;transform:translateY(10px);animation:name-in .8s .72s ease forwards}.app{animation:app-arrive .9s 2.55s cubic-bezier(.16,1,.3,1) both}.copyright{margin:24px 0 4px;color:#56756f;font-size:12px;text-align:center}.copyright strong{color:var(--ink)}@keyframes letter-in{to{opacity:1;filter:blur(0);transform:none}}@keyframes rule-in{to{width:min(240px,62vw)}}@keyframes name-in{to{opacity:.88;transform:none}}@keyframes halo{0%{opacity:0;transform:scale(.6)}45%{opacity:1}100%{opacity:.45;transform:scale(1.12)}}@keyframes light-sweep{to{transform:translateX(55%) rotate(8deg)}}@keyframes splash-away{0%{clip-path:inset(0 0 0 0);opacity:1}100%{clip-path:inset(0 0 100% 0);opacity:.8;visibility:hidden}}@keyframes app-arrive{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.splash{animation:splash-away .01ms .8s forwards}.splash:before,.splash:after,.splash-mark span,.splash-rule,.splash-name,.app{animation:none}.splash-mark span,.splash-name{opacity:1;filter:none;transform:none}.splash-rule{width:min(240px,62vw)}}</style></head><body><div class="splash" id="splash" role="status" aria-label="LBM – Loenne Beckendorf"><div class="splash-inner"><p class="splash-mark" aria-hidden="true"><span>L</span><span>B</span><span>M</span></p><div class="splash-rule" aria-hidden="true"></div><p class="splash-name">Loenne Beckendorf</p></div></div><main class="app"><header><div><p class="brand">Loenne · Biologie · Evolution</p><h1>Begriffstrainer</h1></div><div><button class="icon" id="mix" aria-label="Karten mischen">↝</button><button class="icon" id="reset" aria-label="Lernstand zurücksetzen">↺</button></div></header><section aria-label="Lernfortschritt"><div class="meta"><span id="count"></span><span id="known"></span></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span id="bar"></span></div></section><button class="card" id="card"><span class="inner"><span class="face front"><span class="category" id="category"></span><strong class="term" id="term"></strong><span class="aliases hidden" id="aliases"></span><span class="hint">Antippen zum Umdrehen</span></span><span class="face back"><span class="category" id="backterm"></span><span class="definition" id="definition"></span><span class="hint">Antippen zeigt wieder den Begriff</span></span></span></button><div class="nav"><button class="action" id="prev">← <span class="label">Zurück</span></button><div class="center"><button class="action primary" id="show">Antwort zeigen</button><button class="action hidden" id="again">✕ Nochmal</button><button class="action primary hidden" id="yes">✓ Gewusst</button></div><button class="action" id="next"><span class="label">Weiter</span> →</button></div><p class="keyboard">Tastatur: Leertaste umdrehen · ←/→ wechseln · J gewusst · N nochmal</p><footer class="copyright"><strong>© 2026 Loenne Beckendorf</strong> · Alle Rechte vorbehalten</footer></main>
<script>const original=[{"term":"Fossilien","definition":"Erhaltene Reste, Abdrücke oder Spuren früherer Lebewesen. Sie belegen, welche Organismen wann existierten und wie sich Merkmale veränderten.","category":"Evolutionsbelege"},{"term":"Mosaikform","definition":"Organismus mit einer Kombination von Merkmalen verschiedener systematischer Gruppen; auch Brückentier genannt. Beispiel: Archaeopteryx mit Dinosaurier- und Vogelmerkmalen. Er muss kein direkter Vorfahr heutiger Arten sein.","category":"Evolutionsbelege","aliases":["Mosaikformen","Brückentier","Übergangsform"]},{"term":"Homologie","definition":"Ähnlichkeit aufgrund gemeinsamer Abstammung. Homologe Merkmale besitzen denselben Grundbauplan, auch wenn ihre Funktion verschieden sein kann.","category":"Evolutionsbelege"},{"term":"Analogie","definition":"Ähnlichkeit durch gleiche Funktion und ähnlichen Selektionsdruck, aber ohne gemeinsamen Ursprung des Merkmals.","category":"Evolutionsbelege"},{"term":"Progressionsreihe","definition":"Abfolge homologer Organe, in der eine zunehmende Differenzierung oder Leistungsfähigkeit erkennbar ist.","category":"Evolutionsbelege"},{"term":"Regressionsreihe","definition":"Abfolge homologer Organe, die eine schrittweise Rückbildung bis zum Rudiment zeigt.","category":"Evolutionsbelege"},{"term":"Divergenz","definition":"Auseinanderentwicklung verwandter Arten oder homologer Merkmale durch unterschiedliche Umweltbedingungen und Selektionsdrücke.","category":"Evolutionsbelege"},{"term":"Konvergenz","definition":"Unabhängige Entwicklung ähnlicher, analoger Merkmale bei nicht nah verwandten Arten aufgrund ähnlicher Umweltbedingungen.","category":"Evolutionsbelege"},{"term":"Biogenetische Grundregel","definition":"Haeckels historische These: Die Ontogenese wiederholt die Phylogenese verkürzt. Als allgemeines Gesetz gilt sie heute nicht. Ähnliche Embryonalmerkmale können dennoch gemeinsame Abstammung belegen.","category":"Evolutionsbelege","aliases":["Haeckels biogenetisches Gesetz"]},{"term":"Atavismus","definition":"Seltenes Wiederauftreten eines Ahnenmerkmals, das bei den unmittelbaren Vorfahren normalerweise nicht ausgeprägt ist.","category":"Evolutionsbelege"},{"term":"Organrudiment","definition":"Zurückgebildetes Organ, das seine ursprüngliche Funktion ganz oder teilweise verloren hat.","category":"Evolutionsbelege","aliases":["Rudiment"]},{"term":"Homologe Gene","definition":"Gene mit gemeinsamem evolutionärem Ursprung und ähnlicher DNA-Sequenz. Orthologe entstehen durch Artbildung, paraloge durch Genverdopplung.","category":"Molekulare Belege"},{"term":"Molekulare Uhr","definition":"Abschätzung evolutionärer Trennungszeiten aus Sequenzunterschieden. Sie setzt eine angenäherte Substitutionsrate und eine Kalibrierung voraus, etwa durch Fossilien. Raten können zwischen Genen und Linien variieren.","category":"Molekulare Belege"},{"term":"Evolutionsrate","definition":"Geschwindigkeit evolutionärer Veränderung. Molekular wird sie etwa als Zahl der Basen- oder Aminosäuresubstitutionen pro Position und Zeiteinheit gemessen.","category":"Molekulare Belege"},{"term":"DNA-Sequenzierung","definition":"Bestimmung der Basenreihenfolge eines DNA-Abschnitts. Sequenzähnlichkeiten erlauben Rückschlüsse auf Verwandtschaft.","category":"Molekulare Belege"},{"term":"DNA-Hybridisierung","definition":"Einzelstränge verschiedener DNA-Proben werden gepaart. Je stabiler die Hybrid-DNA, desto ähnlicher sind die Sequenzen.","category":"Molekulare Belege","aliases":["DNA-DNA-Hybridisierung"]},{"term":"Aminosäuresequenzanalyse","definition":"Vergleich der Aminosäurefolgen homologer Proteine. Wenige Unterschiede sprechen meist für nahe Verwandtschaft.","category":"Molekulare Belege"},{"term":"Intrachromosomale Rekombination","definition":"Neukombination von Allelen durch Crossing-over zwischen homologen Chromosomen in der Prophase I der Meiose.","category":"Genetische Vielfalt"},{"term":"Interchromosomale Rekombination","definition":"Zufällige, unabhängige Verteilung mütterlicher und väterlicher Chromosomen auf die Keimzellen während der Meiose.","category":"Genetische Vielfalt"},{"term":"Mutation","definition":"Dauerhafte Veränderung des Erbguts. Vererbbare Mutationen erzeugen neue Allele und damit das Rohmaterial der Evolution.","category":"Genetische Vielfalt"},{"term":"Variation","definition":"Unterschiede zwischen Individuen einer Population. Sie entstehen genetisch durch Mutation und Rekombination sowie durch Umwelteinflüsse.","category":"Genetische Vielfalt"},{"term":"Natürliche Selektion","definition":"Individuen mit erblichen, vorteilhaften Merkmalen haben im Mittel mehr fortpflanzungsfähige Nachkommen. Dadurch verändern sich Allelfrequenzen.","category":"Selektion"},{"term":"Selektionsfaktoren","definition":"Umwelteinflüsse, die den Fortpflanzungserfolg beeinflussen: abiotisch wie Temperatur und biotisch wie Konkurrenz oder Fressfeinde.","category":"Selektion"},{"term":"Transformierende Selektion","definition":"Eine extreme Merkmalsausprägung wird begünstigt; der Mittelwert der Population verschiebt sich in eine Richtung.","category":"Selektion","aliases":["Gerichtete Selektion"]},{"term":"Disruptive Selektion","definition":"Beide extremen Merkmalsausprägungen werden gegenüber der mittleren begünstigt. Die Population kann sich aufspalten.","category":"Selektion","aliases":["Aufspaltende Selektion"]},{"term":"Stabilisierende Selektion","definition":"Mittlere Merkmalsausprägungen werden begünstigt, Extreme benachteiligt. Die Variationsbreite nimmt ab.","category":"Selektion","aliases":["Normierende Selektion"]},{"term":"Fitness","definition":"Relativer Beitrag eines Individuums zum Genpool der nächsten Generation, gemessen am Fortpflanzungserfolg.","category":"Selektion"},{"term":"Population","definition":"Fortpflanzungsgemeinschaft von Individuen einer Art, die zur gleichen Zeit in einem abgegrenzten Gebiet lebt.","category":"Populationsgenetik"},{"term":"Genpool","definition":"Gesamtheit aller Gene und Allele einer Population zu einem bestimmten Zeitpunkt.","category":"Populationsgenetik"},{"term":"Polymorphismus","definition":"Vorkommen mehrerer genetisch bedingter Varianten eines Merkmals oder Genortes innerhalb einer Population, z. B. unterschiedliche Farbformen.","category":"Populationsgenetik"},{"term":"Allelfrequenz","definition":"Relativer Anteil eines bestimmten Allels an allen Allelen eines Genortes innerhalb einer Population.","category":"Populationsgenetik"},{"term":"Hardy-Weinberg-Gleichgewicht","definition":"Modellzustand: In einer idealen Population bleiben Allelfrequenzen konstant. Voraussetzungen sind unter anderem Zufallspaarung, keine Selektion, Mutation, Migration oder Drift.","category":"Populationsgenetik","aliases":["Hardy-Weinberg-Gesetz"]},{"term":"Genetische Drift","definition":"Zufällige Veränderung von Allelfrequenzen, besonders wirksam in kleinen Populationen.","category":"Populationsgenetik","aliases":["Gendrift"]},{"term":"Gründereffekt","definition":"Form der Gendrift: Wenige Individuen gründen eine Population, deren Genpool nur einen zufälligen Ausschnitt der Ausgangspopulation enthält.","category":"Populationsgenetik"},{"term":"Flaschenhalseffekt","definition":"Form der Gendrift: Eine Population schrumpft stark; die wenigen Überlebenden bestimmen zufällig den künftigen Genpool.","category":"Populationsgenetik"},{"term":"Genfluss","definition":"Austausch von Allelen zwischen Populationen durch Zu- und Abwanderung mit anschließender Fortpflanzung.","category":"Populationsgenetik"},{"term":"Morphologisches Artkonzept","definition":"Individuen werden anhand wesentlicher gemeinsamer Körpermerkmale zu einer Art zusammengefasst.","category":"Artbildung","aliases":["Typologisches Artkonzept"]},{"term":"Biologisches Artkonzept","definition":"Eine Art umfasst natürliche Populationen, deren Individuen fruchtbare Nachkommen erzeugen können und von anderen Gruppen reproduktiv isoliert sind.","category":"Artbildung","aliases":["Art (biologisch)"]},{"term":"Phylogenetisches Artkonzept","definition":"Eine Art ist die kleinste unterscheidbare Abstammungsgemeinschaft mit gemeinsamem Vorfahren und kennzeichnenden Merkmalen; auch kladistisches Artkonzept genannt.","category":"Artbildung","aliases":["Kladistisches Artkonzept"]},{"term":"Allopatrische Artbildung","definition":"Neue Arten entstehen nach geografischer Trennung, weil sich die getrennten Genpools unabhängig entwickeln.","category":"Artbildung"},{"term":"Sympatrische Artbildung","definition":"Neue Arten entstehen im selben geografischen Gebiet, etwa durch ökologische Spezialisierung, sexuelle Selektion oder Polyploidisierung.","category":"Artbildung"},{"term":"Peripatrische Artbildung","definition":"Sonderform der allopatrischen Artbildung: Eine kleine Randpopulation wird isoliert; Gründereffekt und Selektion beschleunigen die Aufspaltung.","category":"Artbildung"},{"term":"Adaptive Radiation","definition":"Rasche Aufspaltung einer Stammart in viele Arten, die unterschiedliche ökologische Nischen besetzen.","category":"Artbildung"},{"term":"Isolation","definition":"Unterbrechung des Genflusses zwischen Populationen. Dauerhafte Isolation ermöglicht ihre unabhängige Evolution.","category":"Artbildung","aliases":["Isolationsmechanismen"]},{"term":"Präzygotische Isolation","definition":"Fortpflanzungsbarrieren verhindern Paarung oder Befruchtung, etwa durch unterschiedliche Zeiten, Lebensräume, Verhaltensweisen oder Mechanik.","category":"Artbildung","aliases":["Präzygotische Barriere"]},{"term":"Postzygotische Isolation","definition":"Nach der Befruchtung sind Hybride nicht lebensfähig, unfruchtbar oder in späteren Generationen geschwächt.","category":"Artbildung","aliases":["Postzygotische Barriere"]},{"term":"Evolution","definition":"Veränderung vererbbarer Merkmale von Populationen über Generationen. Dazu gehören Änderungen der Allelfrequenzen, Anpassung, Artbildung und gemeinsame Abstammung.","category":"Evolution und Grundlagen"},{"term":"Darwins Evolutionstheorie","definition":"Individuen variieren erblich und erzeugen mehr Nachkommen, als überleben können. Wer unter den jeweiligen Bedingungen mehr fortpflanzungsfähige Nachkommen hat, gibt seine Merkmale häufiger weiter.","category":"Evolution und Grundlagen","aliases":["Natürliche Auslese nach Darwin"]},{"term":"Evolutionsbelege","definition":"Hinweise auf gemeinsame Abstammung und evolutionäre Veränderung: Fossilien, Homologien, Rudimente, Entwicklungsmerkmale sowie DNA- und Proteinvergleiche.","category":"Evolutionsbelege","aliases":["Belege der Evolution"]},{"term":"Anatomie","definition":"Wissenschaft vom inneren Aufbau eines Organismus und seiner Organe. Vergleichende Anatomie untersucht Gemeinsamkeiten und Unterschiede zwischen Arten.","category":"Evolutionsbelege"},{"term":"Morphologie","definition":"Wissenschaft von Form und Gestalt der Lebewesen und ihrer Strukturen. Morphologische Vergleiche helfen, Merkmale zu beschreiben und Verwandtschaft zu untersuchen.","category":"Evolutionsbelege"},{"term":"Homologiekriterien","definition":"Kriterien zum Erkennen gemeinsamer Herkunft von Strukturen: Lage, spezifische Qualität und Stetigkeit. Auch bei unterschiedlicher Form oder Funktion können Strukturen homolog sein.","category":"Evolutionsbelege"},{"term":"Kriterium der Lage","definition":"Strukturen sind homolog, wenn sie im vergleichbaren Gesamtbauplan dieselbe relative Lage haben. Beispiel: Oberarmknochen in Menschenarm, Walflosse und Fledermausflügel.","category":"Evolutionsbelege","aliases":["Homologiekriterium: Lage"]},{"term":"Kriterium der spezifischen Qualität","definition":"Strukturen sind homolog, wenn sie in vielen besonderen Einzelmerkmalen ihres komplexen Aufbaus übereinstimmen. Die Lage oder Funktion kann dabei unterschiedlich sein.","category":"Evolutionsbelege","aliases":["Homologiekriterium: spezifische Qualität"]},{"term":"Kriterium der Stetigkeit","definition":"Unterschiedlich aussehende Strukturen sind homolog, wenn sich ihre Verbindung durch Zwischenformen belegen lässt, etwa durch Fossilien oder Stadien der Embryonalentwicklung.","category":"Evolutionsbelege","aliases":["Homologiekriterium: Stetigkeit","Kontinuität"]},{"term":"Parallelismus","definition":"Unabhängige Entwicklung ähnlicher Merkmale in verwandten Linien aus ähnlichen Ausgangsstrukturen oder Entwicklungswegen. Die neuen Merkmalsausprägungen entstanden nicht beim gemeinsamen Vorfahren.","category":"Evolutionsbelege","aliases":["Parallele Evolution"]},{"term":"Paläontologie","definition":"Wissenschaft von den Lebewesen vergangener Erdzeitalter. Sie untersucht Fossilien, frühere Lebensräume und die Entwicklung des Lebens.","category":"Paläontologie"},{"term":"Relative Altersbestimmung","definition":"Einordnung von Gesteinen oder Fossilien als älter oder jünger, ohne ein Zahlenalter zu bestimmen. Grundlage sind z. B. Schichtfolgen und der Vergleich von Leitfossilien.","category":"Paläontologie"},{"term":"Absolute Altersbestimmung","definition":"Bestimmung eines Zahlenalters, oft durch Messung radioaktiven Zerfalls. Datierbare Minerale einer Gesteinsschicht können das Alter zugehöriger Fossilien eingrenzen.","category":"Paläontologie","aliases":["Radiometrische Datierung"]},{"term":"Biostratigraphie","definition":"Gliederung und zeitliche Zuordnung von Gesteinsschichten anhand ihres Fossilinhalts. Leitfossilien erlauben den Vergleich auch weit voneinander entfernter Schichten.","category":"Paläontologie"},{"term":"Leitfossil","definition":"Fossil einer Art mit kurzer geologischer Existenzdauer und weiter Verbreitung, das gut erkennbar ist. Es hilft, Schichten relativ zu datieren und miteinander zu vergleichen.","category":"Paläontologie","aliases":["Leitfossilien"]},{"term":"Körperfossil","definition":"Erhaltener Rest des Körpers eines Lebewesens, z. B. Knochen oder Schalen. In besonderen Fällen bleiben auch Weichteile erhalten, etwa in Eis oder Bernstein.","category":"Paläontologie","aliases":["Körperfossilien"]},{"term":"Sedimentfossil","definition":"Im Sediment erhaltenes Fossil. Nach Einbettung und Verfestigung können z. B. versteinerte Hartteile, Steinkerne oder Abdrücke zurückbleiben; die Formen überschneiden sich teils.","category":"Paläontologie","aliases":["Sedimentfossilien"]},{"term":"Hartteilfossil","definition":"Erhaltene oder mineralisch ersetzte harte Körperteile, etwa Knochen, Zähne oder Schalen. Minerale können Hohlräume ausfüllen oder ursprüngliches Material ersetzen.","category":"Paläontologie","aliases":["Hartteilfossilien"]},{"term":"Steinkern","definition":"Verfestigte Füllung eines ehemaligen Hohlraums, z. B. im Inneren einer Muschelschale. Löst sich die Schale auf, bleibt die Form ihres Innenraums erhalten.","category":"Paläontologie"},{"term":"Abdruckfossil","definition":"Im Sediment erhaltener Abdruck einer Körperoberfläche, z. B. eines Blattes. Der ursprüngliche Körper kann vollständig vergangen sein.","category":"Paläontologie","aliases":["Abdruckfossilien"]},{"term":"Lebendes Fossil","definition":"Heute lebende Linie, deren Körperbau dem lange bekannter Fossilien ähnelt, z. B. Quastenflosser. Der Ausdruck bedeutet nicht, dass diese Organismen aufgehört hätten, sich zu entwickeln.","category":"Paläontologie"},{"term":"Stammgruppenvertreter","definition":"Art einer ausgestorbenen Seitenlinie, die außerhalb einer heutigen Kronengruppe steht, ihr aber näher als anderen lebenden Gruppen verwandt ist. Sie muss kein direkter Vorfahr der heutigen Arten sein.","category":"Paläontologie"},{"term":"Embryologie","definition":"Wissenschaft von der Entwicklung des Embryos. Der Vergleich von Embryonalmerkmalen verschiedener Arten kann Hinweise auf gemeinsame Abstammung liefern.","category":"Entwicklungsbiologie"},{"term":"Entwicklungsbiologie","definition":"Untersucht, wie sich ein Organismus entwickelt und wie Gene und Zellen dabei zusammenwirken. Die Embryologie behandelt darin besonders die Embryonalentwicklung.","category":"Entwicklungsbiologie"},{"term":"Ontogenese","definition":"Individualentwicklung eines Organismus, von seiner Entstehung über Wachstum und Reifung bis zum Tod. Sie ist von der Stammesgeschichte einer Gruppe zu unterscheiden.","category":"Entwicklungsbiologie","aliases":["Ontogenie"]},{"term":"Phylogenese","definition":"Stammesgeschichtliche Entwicklung einer Art oder Verwandtschaftsgruppe über viele Generationen. Ihre Beziehungen lassen sich in Stammbäumen darstellen.","category":"Entwicklungsbiologie","aliases":["Phylogenie"]},{"term":"Homöotische Gene","definition":"Entwicklungskontrollgene, die die Identität von Körperregionen oder Organen bestimmen. Viele codieren Transkriptionsfaktoren; Hox-Gene sind ein bekanntes Beispiel.","category":"Entwicklungsbiologie","aliases":["Homöotische Entwicklungskontrollgene"]},{"term":"Transkriptionsfaktoren","definition":"Proteine, die die Transkription bestimmter Gene aktivieren oder hemmen, meist durch Bindung an regulatorische DNA. Sie steuern, welche Gene wann abgelesen werden.","category":"Entwicklungsbiologie"},{"term":"Genotyp","definition":"Genetische Ausstattung eines Individuums; je nach Zusammenhang auch seine Allelkombination an einem bestimmten Genort.","category":"Genetische Vielfalt"},{"term":"Phänotyp","definition":"Beobachtbare Merkmale eines Individuums, einschließlich körperlicher, physiologischer und Verhaltensmerkmale. Sie entstehen im Zusammenspiel von Genotyp und Umwelt.","category":"Genetische Vielfalt"},{"term":"Genetische Diversität","definition":"Vielfalt der Allele und Genotypen innerhalb einer Population oder Art. Mutation, Rekombination und Genfluss können dazu beitragen.","category":"Genetische Vielfalt","aliases":["Genetische Vielfalt"]},{"term":"Phänotypische Diversität","definition":"Vielfalt der Merkmalsausprägungen innerhalb einer Population. Sie kann genetisch bedingt sein oder durch unterschiedliche Umweltbedingungen entstehen.","category":"Genetische Vielfalt","aliases":["Phänotypische Vielfalt"]},{"term":"Sexuelle Fortpflanzung","definition":"Fortpflanzung mit Verschmelzung von Keimzellen. Meiose und Befruchtung kombinieren Erbinformation neu und erzeugen genetische Vielfalt bei den Nachkommen.","category":"Genetische Vielfalt","aliases":["Geschlechtliche Fortpflanzung"]},{"term":"Asexuelle Fortpflanzung","definition":"Fortpflanzung ohne Verschmelzung von Keimzellen. Die Nachkommen sind meist genetisch weitgehend gleich; Mutationen können dennoch Unterschiede erzeugen.","category":"Genetische Vielfalt","aliases":["Ungeschlechtliche Fortpflanzung"]},{"term":"Rekombination","definition":"Neukombination vorhandener Allele bei sexueller Fortpflanzung, z. B. durch Crossing-over und die Verteilung der Chromosomen in der Meiose. Sie erzeugt neue Kombinationen, nicht selbst neue Allele.","category":"Genetische Vielfalt"},{"term":"Populationsgenetik","definition":"Untersucht Allel- und Genotypfrequenzen in Populationen sowie ihre Veränderung durch Mutation, Selektion, genetische Drift, Genfluss und das Paarungsverhalten.","category":"Populationsgenetik"},{"term":"Panmixie","definition":"Zufällige Paarung innerhalb einer Population: Die Wahl des Partners erfolgt unabhängig vom betrachteten Genotyp. Sie ist eine Voraussetzung des Hardy-Weinberg-Modells.","category":"Populationsgenetik","aliases":["Zufallspaarung"]},{"term":"Selektionsdruck","definition":"Einfluss von Selektionsfaktoren auf Unterschiede im Fortpflanzungserfolg. Je stärker bestimmte erbliche Merkmale die Fitness beeinflussen, desto stärker kann die Auswahl wirken.","category":"Selektion"},{"term":"Parapatrische Artbildung","definition":"Artbildung in benachbarten Verbreitungsgebieten ohne vollständige räumliche Trennung. Unterschiedliche Selektionsbedingungen und begrenzter Genfluss können zur Aufspaltung führen.","category":"Artbildung"},{"term":"Stammart","definition":"Ausgangsart, aus der durch evolutionäre Aufspaltung neue Arten hervorgehen. Bei adaptiver Radiation entstehen daraus viele Arten mit verschiedenen ökologischen Nischen.","category":"Artbildung"},{"term":"Geografische Isolation","definition":"Räumliche Trennung von Populationen, z. B. durch Gebirge, Inselbildung oder Flüsse. Sie unterbricht oder verringert den Genfluss und kann allopatrische Artbildung ermöglichen.","category":"Artbildung","aliases":["Räumliche Isolation"]},{"term":"Ökologische Isolation","definition":"Populationen nutzen unterschiedliche Lebensräume oder ökologische Nischen und treffen sich deshalb kaum zur Fortpflanzung. Sie ist eine präzygotische Barriere.","category":"Artbildung","aliases":["Habitat-Isolation"]},{"term":"Zeitliche Isolation","definition":"Unterschiedliche Fortpflanzungs-, Blüh- oder Aktivitätszeiten verhindern Paarung oder Befruchtung. Sie wirkt vor der Entstehung einer Zygote.","category":"Artbildung","aliases":["Temporale Isolation"]},{"term":"Verhaltensisolation","definition":"Unterschiedliche Balzsignale oder Paarungsverhaltensweisen verhindern die Partnererkennung und Paarung. Beispiel: verschiedene Balzgesänge. Eine präzygotische Barriere.","category":"Artbildung","aliases":["Ethologische Isolation","balzbedingte Isolation"]},{"term":"Mechanische Isolation","definition":"Unterschiede im Bau der Fortpflanzungsorgane oder Blüten verhindern Paarung oder die Übertragung von Keimzellen. Eine präzygotische Barriere.","category":"Artbildung"},{"term":"Gametische Isolation","definition":"Keimzellen verschiedener Arten sind biochemisch unverträglich. Spermium und Eizelle bzw. Pollen und Eizelle können keine Zygote bilden. Eine präzygotische Barriere.","category":"Artbildung"},{"term":"Embryonalsterblichkeit","definition":"Nach der Befruchtung scheitert die Entwicklung eines Hybriden; der Embryo stirbt ab. Eine Form postzygotischer Isolation durch verringerte Hybridlebensfähigkeit.","category":"Artbildung","aliases":["Gestörte Embryonalentwicklung bei Hybriden"]},{"term":"Hybridsterilität","definition":"Hybride entstehen und können lebensfähig sein, sind aber unfruchtbar. Beispiel: Maultiere sind in der Regel steril. Diese Barriere wirkt nach der Befruchtung.","category":"Artbildung"},{"term":"Molekularbiologie","definition":"Untersucht biologische Vorgänge auf molekularer Ebene, besonders Aufbau und Funktion von DNA, RNA und Proteinen. Molekulare Vergleiche liefern auch Evolutionsbelege.","category":"Molekulare Belege"},{"term":"Molekulare Methoden","definition":"Verfahren zur Analyse von DNA, RNA oder Proteinen, z. B. PCR, Sequenzierung und Sequenzvergleiche. Sie können Verwandtschaft und evolutionäre Veränderungen untersuchen.","category":"Molekulare Belege"},{"term":"Systematik","definition":"Wissenschaft von Vielfalt, Verwandtschaft und Einordnung der Lebewesen. Moderne Systematik ordnet Gruppen möglichst nach ihrer gemeinsamen Abstammung.","category":"Systematik"},{"term":"Systematische Gruppe","definition":"Eine in der biologischen Systematik benannte Einheit, z. B. Art, Gattung oder Familie. Ein Taxon ist nicht automatisch eine monophyletische Abstammungsgruppe.","category":"Systematik","aliases":["Taxon"]},{"term":"Monophyletische Gruppe","definition":"Verwandtschaftsgruppe, die den letzten gemeinsamen Vorfahren und alle seine Nachkommen umfasst. Eine solche vollständige Abstammungsgemeinschaft heißt auch Klade.","category":"Systematik","aliases":["Klade"]},{"term":"Paraphyletische Gruppe","definition":"Gruppe, die den gemeinsamen Vorfahren, aber nur einen Teil seiner Nachkommen umfasst. Beispiel: Reptilien im traditionellen Sinn ohne Vögel.","category":"Systematik"},{"term":"Genstruktur","definition":"Aufbau eines Gens mit codierenden und regulatorischen Bereichen. Bei vielen eukaryotischen Genen gehören Exons und Introns dazu; solche Merkmale können vergleichend untersucht werden.","category":"Molekulare Belege"},{"term":"Genduplikation","definition":"Verdopplung eines Gens, sodass zwei Kopien entstehen. Eine Kopie kann neue Funktionen entwickeln, während die andere die ursprüngliche Funktion behält.","category":"Molekulare Belege","aliases":["Genverdopplung"]},{"term":"Genfamilie","definition":"Gruppe homologer Gene, die durch Duplikation und anschließende Veränderung aus einem gemeinsamen Ursprungsgen entstanden sind. Sie besitzen oft ähnliche Sequenzen oder Funktionen.","category":"Molekulare Belege"},{"term":"Genstammbaum","definition":"Stammbaum, der Verwandtschaftsbeziehungen zwischen Genen aus Sequenzvergleichen rekonstruiert. Er muss nicht genau dem Artenstammbaum entsprechen, z. B. nach Genduplikationen.","category":"Molekulare Belege"},{"term":"Konservierte Moleküle","definition":"DNA-Abschnitte oder Proteine, deren Sequenz sich im Laufe der Evolution nur wenig verändert hat, häufig wegen wichtiger Funktionen. Sie eignen sich für bestimmte Verwandtschaftsvergleiche.","category":"Molekulare Belege","aliases":["Konservative Moleküle"]},{"term":"DNA","definition":"Desoxyribonukleinsäure: Träger der Erbinformation. Sie besteht meist aus zwei komplementären Strängen in einer Doppelhelix; die Basen heißen Adenin, Thymin, Guanin und Cytosin.","category":"Molekulare Belege","aliases":["Desoxyribonukleinsäure"]},{"term":"RNA","definition":"Ribonukleinsäure: meist einzelsträngige Nukleinsäure mit Ribose und Uracil statt Thymin. RNA dient u. a. als Informationsüberträger, Bestandteil von Ribosomen und regulatorisches Molekül.","category":"Molekulare Belege","aliases":["Ribonukleinsäure"]},{"term":"Mitochondriale DNA","definition":"DNA in den Mitochondrien, zusätzlich zur DNA im Zellkern. Bei vielen Tieren wird sie überwiegend mütterlich vererbt und häufig für Abstammungs- und Verwandtschaftsanalysen genutzt.","category":"Molekulare Belege","aliases":["mtDNA","mt-DNA"]},{"term":"PCR","definition":"Polymerase-Kettenreaktion: gezielte Vervielfältigung eines DNA-Abschnitts mithilfe von Primern und einer DNA-Polymerase. Wiederholte Zyklen umfassen Strangtrennung, Primerbindung und DNA-Synthese.","category":"Molekulare Belege","aliases":["Polymerase-Kettenreaktion"]},{"term":"Zwei-Schritt-Multiplex-PCR","definition":"Zuerst werden mehrere kurze DNA-Abschnitte gemeinsam amplifiziert; danach wird jeder Abschnitt einzeln weiter vervielfältigt. Das nutzt kleine Mengen alter, fragmentierter DNA effizient und spezifisch.","category":"Molekulare Belege","aliases":["Zweistufige Multiplex-PCR"]},{"term":"Präzipitintest","definition":"Historischer Proteinvergleich: Antikörper gegen Blutserumproteine einer Art reagieren mit denen anderer Arten und bilden Niederschläge. Stärkere Reaktionen deuten meist auf ähnlichere Proteine hin.","category":"Molekulare Belege","aliases":["Serologischer Verwandtschaftstest"]}];let deck=[...original],i=0,flipped=false,learned=new Set;const $=id=>document.getElementById(id);function render(){const c=deck[i];$('term').textContent=c.term;$('term').classList.toggle('long',c.term.length>26);$('aliases').textContent=(c.aliases||[]).join(' · ');$('aliases').classList.toggle('hidden',!c.aliases?.length);$('backterm').textContent=c.term;$('category').textContent=c.category;$('definition').textContent=c.definition;$('count').textContent='Karte '+(i+1)+' / '+deck.length;$('known').textContent=learned.size+' von '+deck.length+' gewusst';const p=Math.round((i+1)/deck.length*100);$('bar').style.width=p+'%';$('bar').parentElement.setAttribute('aria-valuenow',p);$('card').classList.toggle('flipped',flipped);$('show').classList.toggle('hidden',flipped);$('again').classList.toggle('hidden',!flipped);$('yes').classList.toggle('hidden',!flipped)}function flip(){flipped=!flipped;render()}function go(n){flipped=false;i=(i+n+deck.length)%deck.length;render()}function assess(ok){ok?learned.add(deck[i].term):learned.delete(deck[i].term);go(1)}$('card').onclick=flip;$('show').onclick=flip;$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);$('yes').onclick=()=>assess(true);$('again').onclick=()=>assess(false);$('mix').onclick=()=>{deck.sort(()=>Math.random()-.5);i=0;flipped=false;render()};$('reset').onclick=()=>{deck=[...original];i=0;flipped=false;learned.clear();render()};addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();flip()}if(e.code==='ArrowLeft')go(-1);if(e.code==='ArrowRight')go(1);if(flipped&&e.key.toLowerCase()==='j')assess(true);if(flipped&&e.key.toLowerCase()==='n')assess(false)});render();</script></body></html>
