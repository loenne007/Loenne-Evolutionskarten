<style>
:root{--bg:#edf8f3;--ink:#123a35;--green:#176b5c;--line:#b8d8ce;--card:#fff;--gold:#eedb8b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 12%,#f8eab8 0,transparent 30%),radial-gradient(circle at 90% 88%,#bce4d8 0,transparent 30%),var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{width:min(900px,100%);margin:auto;padding:28px 20px}header,.meta,.actions,.nav{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{margin:0;color:var(--green);font-size:12px;font-weight:750;letter-spacing:.15em;text-transform:uppercase}h1{margin:.35rem 0 0;font-size:clamp(2rem,6vw,3.2rem);line-height:1;letter-spacing:-.05em}.icon,.action{border:1px solid var(--line);background:#ffffffcc;color:var(--ink);border-radius:13px;min-height:46px;padding:0 17px;font:inherit;font-weight:650;cursor:pointer}.icon{width:46px;padding:0;font-size:20px}.meta{margin-top:26px;color:#56756f;font-size:14px}.progress{height:6px;margin:9px 0 22px;border-radius:99px;background:#d4e8e1;overflow:hidden}.progress span{display:block;height:100%;background:var(--green);transition:width .3s}.card{width:100%;height:clamp(390px,54vh,510px);padding:0;border:0;background:transparent;perspective:1300px;cursor:pointer}.inner{position:relative;display:grid;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1)}.flipped .inner{transform:rotateY(180deg)}.face{grid-area:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:clamp(28px,7vw,70px);border:1px solid var(--line);border-radius:28px;backface-visibility:hidden;box-shadow:0 28px 70px #176b5c20}.front{background:linear-gradient(145deg,#fffdf5,var(--card))}.back{transform:rotateY(180deg);background:linear-gradient(145deg,#257b6b,var(--green));color:#fff}.category{font-size:12px;font-weight:750;letter-spacing:.13em;text-transform:uppercase;opacity:.72}.term{max-width:18ch;font-size:clamp(2.25rem,7vw,4.8rem);font-weight:750;line-height:1;letter-spacing:-.055em;overflow-wrap:anywhere}.definition{max-width:34ch;font-size:clamp(1.2rem,3vw,1.8rem);line-height:1.45}.hint{position:absolute;bottom:23px;font-size:13px;opacity:.58}.nav{margin-top:18px}.center{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1}.primary{background:var(--green);color:#fff;border-color:var(--green)}.keyboard{text-align:center;color:#68817c;font-size:13px}.hidden{display:none}.card:focus-visible,.action:focus-visible,.icon:focus-visible{outline:3px solid #4fa994;outline-offset:4px}@media(max-width:520px){.app{padding:20px 14px}.action{padding:0 12px}.label{display:none}.keyboard{display:none}.face{padding:28px 22px 56px}}@media(prefers-reduced-motion:reduce){.inner{transition:none}}
</style><style>.splash{position:fixed;z-index:100;inset:0;display:grid;place-items:center;overflow:hidden;isolation:isolate;background:linear-gradient(145deg,#092c28,#123a35 55%,#0e4a40);color:#fff;animation:splash-away .9s 2.45s cubic-bezier(.7,0,.25,1) forwards}.splash:before{content:"";position:absolute;z-index:-1;width:min(72vw,680px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#65cbb03d 0,#65cbb012 38%,transparent 70%);animation:halo 2.3s ease-in-out both}.splash:after{content:"";position:absolute;inset:-40%;z-index:-1;background:linear-gradient(105deg,transparent 43%,#fff1b21c 49%,#fff5cb38 50%,#fff1b21c 51%,transparent 57%);transform:translateX(-55%) rotate(8deg);animation:light-sweep 1.5s .45s cubic-bezier(.2,.7,.2,1) both}.splash-inner{text-align:center}.splash-mark{display:flex;justify-content:center;gap:.02em;margin:0;color:var(--gold);font-size:clamp(4rem,18vw,9rem);font-weight:850;letter-spacing:-.1em;line-height:.8;text-shadow:0 0 42px #f7e7a52b}.splash-mark span{display:inline-block;opacity:0;filter:blur(12px);transform:translateY(30px) scale(.84);animation:letter-in .8s cubic-bezier(.16,1,.3,1) forwards}.splash-mark span:nth-child(2){animation-delay:.11s}.splash-mark span:nth-child(3){animation-delay:.22s}.splash-rule{width:0;height:1px;margin:1.4rem auto 1rem;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:rule-in .9s .55s cubic-bezier(.16,1,.3,1) forwards}.splash-name{margin:0;font-size:clamp(.9rem,3vw,1.3rem);font-weight:600;letter-spacing:.22em;text-transform:uppercase;opacity:0;transform:translateY(10px);animation:name-in .8s .72s ease forwards}.app{animation:app-arrive .9s 2.55s cubic-bezier(.16,1,.3,1) both}.copyright{margin:24px 0 4px;color:#56756f;font-size:12px;text-align:center}.copyright strong{color:var(--ink)}@keyframes letter-in{to{opacity:1;filter:blur(0);transform:none}}@keyframes rule-in{to{width:min(240px,62vw)}}@keyframes name-in{to{opacity:.88;transform:none}}@keyframes halo{0%{opacity:0;transform:scale(.6)}45%{opacity:1}100%{opacity:.45;transform:scale(1.12)}}@keyframes light-sweep{to{transform:translateX(55%) rotate(8deg)}}@keyframes splash-away{0%{clip-path:inset(0 0 0 0);opacity:1}100%{clip-path:inset(0 0 100% 0);opacity:.8;visibility:hidden}}@keyframes app-arrive{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.splash{animation:splash-away .01ms .8s forwards}.splash:before,.splash:after,.splash-mark span,.splash-rule,.splash-name,.app{animation:none}.splash-mark span,.splash-name{opacity:1;filter:none;transform:none}.splash-rule{width:min(240px,62vw)}}</style></head><body><div class="splash" id="splash" role="status" aria-label="LBM – Loenne Beckendorf"><div class="splash-inner"><p class="splash-mark" aria-hidden="true"><span>L</span><span>B</span><span>M</span></p><div class="splash-rule" aria-hidden="true"></div><p class="splash-name">Loenne Beckendorf</p></div></div><main class="app"><header><div><p class="brand">Loenne · Biologie · Evolution</p><h1>Begriffstrainer</h1></div><div><button class="icon" id="mix" aria-label="Karten mischen">↝</button><button class="icon" id="reset" aria-label="Lernstand zurücksetzen">↺</button></div></header><section aria-label="Lernfortschritt"><div class="meta"><span id="count"></span><span id="known"></span></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span id="bar"></span></div></section><button class="card" id="card"><span class="inner"><span class="face front"><span class="category" id="category"></span><strong class="term" id="term"></strong><span class="hint">Antippen zum Umdrehen</span></span><span class="face back"><span class="category" id="backterm"></span><span class="definition" id="definition"></span><span class="hint">Antippen zeigt wieder den Begriff</span></span></span></button><div class="nav"><button class="action" id="prev">← <span class="label">Zurück</span></button><div class="center"><button class="action primary" id="show">Antwort zeigen</button><button class="action hidden" id="again">✕ Nochmal</button><button class="action primary hidden" id="yes">✓ Gewusst</button></div><button class="action" id="next"><span class="label">Weiter</span> →</button></div><p class="keyboard">Tastatur: Leertaste umdrehen · ←/→ wechseln · J gewusst · N nochmal</p><footer class="copyright"><strong>© 2026 Loenne Beckendorf</strong> · Alle Rechte vorbehalten</footer></main>
<script>const original=[{"term":"Fossilien","definition":"Erhaltene Reste, Abdrücke oder Spuren früherer Lebewesen. Sie belegen, welche Organismen wann existierten und wie sich Merkmale veränderten.","category":"Evolutionsbelege"},{"term":"Mosaikform","definition":"Organismus mit Merkmalen verschiedener systematischer Gruppen. Beispiel: Archaeopteryx verbindet Dinosaurier- und Vogelmerkmale.","category":"Evolutionsbelege"},{"term":"Homologie","definition":"Ähnlichkeit aufgrund gemeinsamer Abstammung. Homologe Merkmale besitzen denselben Grundbauplan, auch wenn ihre Funktion verschieden sein kann.","category":"Evolutionsbelege"},{"term":"Analogie","definition":"Ähnlichkeit durch gleiche Funktion und ähnlichen Selektionsdruck, aber ohne gemeinsamen Ursprung des Merkmals.","category":"Evolutionsbelege"},{"term":"Progressionsreihe","definition":"Abfolge homologer Organe, in der eine zunehmende Differenzierung oder Leistungsfähigkeit erkennbar ist.","category":"Evolutionsbelege"},{"term":"Regressionsreihe","definition":"Abfolge homologer Organe, die eine schrittweise Rückbildung bis zum Rudiment zeigt.","category":"Evolutionsbelege"},{"term":"Divergenz","definition":"Auseinanderentwicklung verwandter Arten oder homologer Merkmale durch unterschiedliche Umweltbedingungen und Selektionsdrücke.","category":"Evolutionsbelege"},{"term":"Konvergenz","definition":"Unabhängige Entwicklung ähnlicher, analoger Merkmale bei nicht nah verwandten Arten aufgrund ähnlicher Umweltbedingungen.","category":"Evolutionsbelege"},{"term":"Biogenetische Grundregel","definition":"Historische Kurzform: Die Individualentwicklung wiederholt die Stammesgeschichte teilweise und stark verkürzt. Heute gilt sie nur eingeschränkt.","category":"Evolutionsbelege"},{"term":"Atavismus","definition":"Seltenes Wiederauftreten eines Ahnenmerkmals, das bei den unmittelbaren Vorfahren normalerweise nicht ausgeprägt ist.","category":"Evolutionsbelege"},{"term":"Organrudiment","definition":"Zurückgebildetes Organ, das seine ursprüngliche Funktion ganz oder teilweise verloren hat.","category":"Evolutionsbelege"},{"term":"Homologe Gene","definition":"Gene mit gemeinsamem evolutionärem Ursprung und ähnlicher DNA-Sequenz. Orthologe entstehen durch Artbildung, paraloge durch Genverdopplung.","category":"Molekulare Belege"},{"term":"Molekulare Uhr","definition":"Methode zur Abschätzung von Trennungszeiten: Je mehr neutrale Sequenzunterschiede, desto länger liegt meist der gemeinsame Vorfahr zurück.","category":"Molekulare Belege"},{"term":"Evolutionsrate","definition":"Geschwindigkeit evolutionärer Veränderung, etwa gemessen als Zahl fixierter Mutationen pro Gen und Zeiteinheit.","category":"Molekulare Belege"},{"term":"DNA-Sequenzierung","definition":"Bestimmung der Basenreihenfolge eines DNA-Abschnitts. Sequenzähnlichkeiten erlauben Rückschlüsse auf Verwandtschaft.","category":"Molekulare Belege"},{"term":"DNA-Hybridisierung","definition":"Einzelstränge verschiedener DNA-Proben werden gepaart. Je stabiler die Hybrid-DNA, desto ähnlicher sind die Sequenzen.","category":"Molekulare Belege"},{"term":"Aminosäuresequenzanalyse","definition":"Vergleich der Aminosäurefolgen homologer Proteine. Wenige Unterschiede sprechen meist für nahe Verwandtschaft.","category":"Molekulare Belege"},{"term":"Intrachromosomale Rekombination","definition":"Neukombination von Allelen durch Crossing-over zwischen homologen Chromosomen in der Prophase I der Meiose.","category":"Genetische Vielfalt"},{"term":"Interchromosomale Rekombination","definition":"Zufällige, unabhängige Verteilung mütterlicher und väterlicher Chromosomen auf die Keimzellen während der Meiose.","category":"Genetische Vielfalt"},{"term":"Mutation","definition":"Dauerhafte Veränderung des Erbguts. Vererbbare Mutationen erzeugen neue Allele und damit das Rohmaterial der Evolution.","category":"Genetische Vielfalt"},{"term":"Variation","definition":"Unterschiede zwischen Individuen einer Population. Sie entstehen genetisch durch Mutation und Rekombination sowie durch Umwelteinflüsse.","category":"Genetische Vielfalt"},{"term":"Natürliche Selektion","definition":"Individuen mit erblichen, vorteilhaften Merkmalen haben im Mittel mehr fortpflanzungsfähige Nachkommen. Dadurch verändern sich Allelfrequenzen.","category":"Selektion"},{"term":"Selektionsfaktoren","definition":"Umwelteinflüsse, die den Fortpflanzungserfolg beeinflussen: abiotisch wie Temperatur und biotisch wie Konkurrenz oder Fressfeinde.","category":"Selektion"},{"term":"Transformierende Selektion","definition":"Eine extreme Merkmalsausprägung wird begünstigt; der Mittelwert der Population verschiebt sich in eine Richtung.","category":"Selektion"},{"term":"Disruptive Selektion","definition":"Beide extremen Merkmalsausprägungen werden gegenüber der mittleren begünstigt. Die Population kann sich aufspalten.","category":"Selektion"},{"term":"Stabilisierende Selektion","definition":"Mittlere Merkmalsausprägungen werden begünstigt, Extreme benachteiligt. Die Variationsbreite nimmt ab.","category":"Selektion"},{"term":"Fitness","definition":"Relativer Beitrag eines Individuums zum Genpool der nächsten Generation, gemessen am Fortpflanzungserfolg.","category":"Selektion"},{"term":"Population","definition":"Fortpflanzungsgemeinschaft von Individuen einer Art, die zur gleichen Zeit in einem abgegrenzten Gebiet lebt.","category":"Populationsgenetik"},{"term":"Genpool","definition":"Gesamtheit aller Gene und Allele einer Population zu einem bestimmten Zeitpunkt.","category":"Populationsgenetik"},{"term":"Polymorphismus","definition":"Dauerhaftes Vorkommen von mindestens zwei genetisch bedingten Varianten in einer Population.","category":"Populationsgenetik"},{"term":"Allelfrequenz","definition":"Relativer Anteil eines bestimmten Allels an allen Allelen eines Genortes innerhalb einer Population.","category":"Populationsgenetik"},{"term":"Hardy-Weinberg-Gleichgewicht","definition":"Modellzustand: In einer idealen Population bleiben Allelfrequenzen konstant. Voraussetzungen sind unter anderem Zufallspaarung, keine Selektion, Mutation, Migration oder Drift.","category":"Populationsgenetik"},{"term":"Genetische Drift","definition":"Zufällige Veränderung von Allelfrequenzen, besonders wirksam in kleinen Populationen.","category":"Populationsgenetik"},{"term":"Gründereffekt","definition":"Form der Gendrift: Wenige Individuen gründen eine Population, deren Genpool nur einen zufälligen Ausschnitt der Ausgangspopulation enthält.","category":"Populationsgenetik"},{"term":"Flaschenhalseffekt","definition":"Form der Gendrift: Eine Population schrumpft stark; die wenigen Überlebenden bestimmen zufällig den künftigen Genpool.","category":"Populationsgenetik"},{"term":"Genfluss","definition":"Austausch von Allelen zwischen Populationen durch Zu- und Abwanderung mit anschließender Fortpflanzung.","category":"Populationsgenetik"},{"term":"Morphologisches Artkonzept","definition":"Individuen werden anhand wesentlicher gemeinsamer Körpermerkmale zu einer Art zusammengefasst.","category":"Artbildung"},{"term":"Biologisches Artkonzept","definition":"Eine Art umfasst natürliche Populationen, deren Individuen fruchtbare Nachkommen erzeugen können und von anderen Gruppen reproduktiv isoliert sind.","category":"Artbildung"},{"term":"Phylogenetisches Artkonzept","definition":"Eine Art ist die kleinste unterscheidbare Abstammungsgemeinschaft mit gemeinsamem Vorfahren.","category":"Artbildung"},{"term":"Allopatrische Artbildung","definition":"Neue Arten entstehen nach geografischer Trennung, weil sich die getrennten Genpools unabhängig entwickeln.","category":"Artbildung"},{"term":"Sympatrische Artbildung","definition":"Neue Arten entstehen im selben geografischen Gebiet, etwa durch ökologische Spezialisierung, sexuelle Selektion oder Polyploidisierung.","category":"Artbildung"},{"term":"Peripatrische Artbildung","definition":"Sonderform der allopatrischen Artbildung: Eine kleine Randpopulation wird isoliert; Gründereffekt und Selektion beschleunigen die Aufspaltung.","category":"Artbildung"},{"term":"Adaptive Radiation","definition":"Rasche Aufspaltung einer Stammart in viele Arten, die unterschiedliche ökologische Nischen besetzen.","category":"Artbildung"},{"term":"Isolation","definition":"Unterbrechung des Genflusses zwischen Populationen. Dauerhafte Isolation ermöglicht ihre unabhängige Evolution.","category":"Artbildung"},{"term":"Präzygotische Isolation","definition":"Fortpflanzungsbarrieren verhindern Paarung oder Befruchtung, etwa durch unterschiedliche Zeiten, Lebensräume, Verhaltensweisen oder Mechanik.","category":"Artbildung"},{"term":"Postzygotische Isolation","definition":"Nach der Befruchtung sind Hybride nicht lebensfähig, unfruchtbar oder in späteren Generationen geschwächt.","category":"Artbildung"}];let deck=[...original],i=0,flipped=false,learned=new Set;const $=id=>document.getElementById(id);function render(){const c=deck[i];$('term').textContent=c.term;$('backterm').textContent=c.term;$('category').textContent=c.category;$('definition').textContent=c.definition;$('count').textContent='Karte '+(i+1)+' / '+deck.length;$('known').textContent=learned.size+' von '+deck.length+' gewusst';const p=Math.round((i+1)/deck.length*100);$('bar').style.width=p+'%';$('bar').parentElement.setAttribute('aria-valuenow',p);$('card').classList.toggle('flipped',flipped);$('show').classList.toggle('hidden',flipped);$('again').classList.toggle('hidden',!flipped);$('yes').classList.toggle('hidden',!flipped)}function flip(){flipped=!flipped;render()}function go(n){flipped=false;i=(i+n+deck.length)%deck.length;render()}function assess(ok){ok?learned.add(deck[i].term):learned.delete(deck[i].term);go(1)}$('card').onclick=flip;$('show').onclick=flip;$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);$('yes').onclick=()=>assess(true);$('again').onclick=()=>assess(false);$('mix').onclick=()=>{deck.sort(()=>Math.random()-.5);i=0;flipped=false;render()};$('reset').onclick=()=>{deck=[...original];i=0;flipped=false;learned.clear();render()};addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();flip()}if(e.code==='ArrowLeft')go(-1);if(e.code==='ArrowRight')go(1);if(flipped&&e.key.toLowerCase()==='j')assess(true);if(flipped&&e.key.toLowerCase()==='n')assess(false)});render();</script></body></html>
